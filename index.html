<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MrFlix - Your Destination to Booking Tickets</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <p class="text-logo">MrFlix</p>
        <p class="site-desc">Your only destination to booking movie tickets</p>
        <ul class="nav-links">
          <li class="links"><a href="">What's New?</a></li>
          <li class="links"><a href="">My Tickets</a></li>
          <li class="links"><a href="">Support</a></li>
          <li class="links"><a href="">Account</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="main-section">
        <p class="user-instructions">Enter your details to book tickets!</p>

        <div class="form-container">
          <form>
            <label for="userName"></label>
            <input
              type="text"
              name="userName"
              id="userName"
              placeholder="*Enter your name"
              required
            />

            <label for="userEmail"></label>
            <input
              type="email"
              name="userEmail"
              id="userEmail"
              placeholder="*Enter your email"
              required
            />

            <label for="userMobileNumber"></label>
            <input
              type="tel"
              name="userMobileNumber"
              id="userMobileNumber"
              placeholder="*Enter your mobile number"
              required
            />

            <label for="movieName">Select a movie to watch</label>
            <select name="movieName" id="movieName" required>
              <option value="">--Choose from options--</option>
              <option value="movie1" selected>Movie 1</option>
              <option value="movie2">Movie 2</option>
              <option value="movie 3">Movie 3</option>
            </select>

            <label for="tickets"></label>
            <input
              type="number"
              name="tickets"
              id="tickets"
              placeholder="*Number of tickets to book"
              required
            />

            <div class="buttons-group">
              <button type="reset" id="reset">Reset</button>
              <button type="submit" id="submit">Submit</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
